[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i2"
version = "0.1.75"
description = "The middleware toolbox: signatures as data, decorators, wrappers and multi-object composition"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thor Whalen" }]
keywords = [
    "signature",
    "inspect",
    "decorator",
    "wrapper",
    "middleware",
    "meta-programming",
    "function composition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/i2mint/i2"
Documentation = "https://i2mint.github.io/i2"
Repository = "https://github.com/i2mint/i2"
Issues = "https://github.com/i2mint/i2/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", "misc", "*.ipynb"]

[tool.hatch.build.targets.wheel]
packages = ["i2"]
exclude = ["*.ipynb"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    "**/*.md",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["i2"]
addopts = "--doctest-modules --ignore=i2/examples --ignore=i2/scrap"
# Same flags as the CI test action (wads run-tests-uv), so local runs match CI
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL"]

[tool.wads.ci]
project_name = "i2"

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-q", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["i2/examples", "i2/scrap"]
test_on_windows = false

[tool.wads.ci.metrics]
enabled = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
